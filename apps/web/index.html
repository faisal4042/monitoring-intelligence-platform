<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- No Referer to other sites: X serves post videos (video.twimg.com) only without one, and links/images stay private. Embedded players set their own policy. -->
    <meta name="referrer" content="no-referrer" />
    <title>منصة الرصد والتحليل الرقمي</title>
    <script>
      // Apply the stored theme before first paint to avoid a flash.
      (function () {
        var t = localStorage.getItem('mip-theme') || 'system';
        var dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
