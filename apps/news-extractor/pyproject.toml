[project]
name = "mip-news-extractor"
version = "1.0.0"
description = "MIP news article extractor — Scrapling-based, stateless, isolated (docs/news-scrapling.md)"
requires-python = ">=3.11"
# Pinned: the extractor sets one curl option through Scrapling's session
# internals (see app/fetch.py); upgrade Scrapling only together with its tests.
dependencies = [
  "scrapling[fetchers]==0.4.15",
  "curl_cffi==0.16.3",
  "playwright==1.63.0",
  "lxml==6.1.3",
  "protego==0.7.0",
  "fastapi==0.143.0",
  "uvicorn[standard]==0.54.0",
  "pydantic==2.14.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "psutil>=6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
