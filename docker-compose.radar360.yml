services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    expose:
    - '8080'
    healthcheck:
      test:
      - CMD-SHELL
      - wget -qO- http://127.0.0.1:8080/health | grep -q '"ok":true'
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      TZ: Asia/Riyadh
      API_PORT: '3001'
      APP_URL: https://monitoring.interactivedashboardpages.com
      DATABASE_URL: postgresql://mip:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/radar360_v1_20261018
      REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET}
      LIVE_X_API: 'true'
      X_DRY_RUN: 'false'
      X_BEARER_TOKEN: ${X_BEARER_TOKEN:-}
      X_STREAM_ENABLED: 'true'
      X_STREAM_RULE_REFRESH_SECONDS: ${X_STREAM_RULE_REFRESH_SECONDS:-60}
      X_STREAM_RECONNECT_MAX_SECONDS: '300'
      AUTO_COLLECTION_ENABLED: 'true'
      AUTO_COLLECTION_TICK_SECONDS: ${AUTO_COLLECTION_TICK_SECONDS:-30}
      AUTO_COLLECTION_INTERVAL_MINUTES: ${AUTO_COLLECTION_INTERVAL_MINUTES:-2}
      AUTO_COLLECTION_MAX_RESULTS: ${AUTO_COLLECTION_MAX_RESULTS:-10}
      AUTO_COLLECTION_EXCLUDED_USERS: ${AUTO_COLLECTION_EXCLUDED_USERS:-}
      AI_SERVICE_URL: http://ai:8000
      AI_API_KEY: ${AI_API_KEY:?set AI_API_KEY}
      ALLOW_INTERNAL_DATA_TO_EXTERNAL_AI: 'true'
      AUTO_CLASSIFICATION_ENABLED: 'true'
      AUTO_CLASSIFICATION_TICK_SECONDS: '300'
      AUTO_CLASSIFICATION_BATCH_SIZE: '20'
      NEWS_FETCH_ENABLED: 'true'
      NEWS_FETCH_TICK_SECONDS: ${NEWS_FETCH_TICK_SECONDS:-30}
      NEWS_FETCH_INTERVAL_MINUTES: ${NEWS_FETCH_INTERVAL_MINUTES:-5}
      NEWS_FETCH_BATCH_SIZE: '5'
      LOG_LEVEL: ${LOG_LEVEL:-info}
      MIP_APPROVED_RELEASE: radar360-live-v1-20261018
      MIP_NEWS_READER: legacy
      RUN_DB_MIGRATIONS_ON_START: 'false'
      QUEUE_WORKER_ENABLED: 'true'
      WORKFORCE_WORKER_ENABLED: 'true'
      REPORT_EXPORTS_ENABLED: 'true'
      REPORT_SCHEDULES_ENABLED: 'true'
      REPORT_EXPORT_DIR: /app/report-exports
      YOUTUBE_MODE: ${YOUTUBE_MODE:-dry_run}
      YOUTUBE_LIVE_APPROVED: ${YOUTUBE_LIVE_APPROVED:-0}
      YOUTUBE_SCHEDULER_ENABLED: ${YOUTUBE_SCHEDULER_ENABLED:-false}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      YOUTUBE_DAILY_SEARCH_LIMIT: '80'
      YOUTUBE_DAILY_UNITS_LIMIT: '1000'
      ALERTS_ENABLED: 'true'
      NEWS_SCRAPLING_ENABLED: 'true'
      NEWS_SCRAPLING_DYNAMIC_ENABLED: 'true'
      X_POST_TICKETS_ENABLED: 'true'
      X_POST_TICKETS_SINCE: '2026-10-18T16:47:38+00:00'
      NEWS_EXTRACTOR_URL: http://news-extractor:8010
      NEWS_EXTRACTOR_TOKEN: ${NEWS_EXTRACTOR_TOKEN:?set NEWS_EXTRACTOR_TOKEN}
      YOUTUBE_INTERNAL_LIMITS_ENABLED: 'false'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai:
        condition: service_healthy
      news-extractor:
        condition: service_healthy
    expose:
    - '3001'
    healthcheck:
      test:
      - CMD
      - node
      - -e
      - fetch('http://127.0.0.1:3001/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 90s
    volumes:
    - /root/radar360-deploy-20261018/report-exports:/app/report-exports
    stop_grace_period: 60s
  ai:
    restart: unless-stopped
    environment:
      AI_API_KEY: ${AI_API_KEY:?set AI_API_KEY}
      EMBEDDING_PROVIDER: siliconflow
      EMBEDDING_DIMENSIONS: '1024'
      SILICONFLOW_API_KEY: ${SILICONFLOW_API_KEY:?set SILICONFLOW_API_KEY}
      SILICONFLOW_BASE_URL: https://api.siliconflow.com/v1
      SILICONFLOW_EMBEDDING_MODEL: Qwen/Qwen3-Embedding-8B
      LABEL_PROVIDER: deepseek
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:?set DEEPSEEK_API_KEY}
      DEEPSEEK_BASE_URL: https://api.deepseek.com
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-flash}
    expose:
    - '8000'
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health',
        timeout=3)
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    image: hqak346ube6ddkgkqmdpozsm_ai:11599e9d0bf664ffeb144ebbbbc0a1b6dbc2a502
    pull_policy: never
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: mip
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: mip
    volumes:
    - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U mip -d mip
      interval: 10s
      timeout: 5s
      retries: 10
    pull_policy: never
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
    - sh
    - -c
    - exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    volumes:
    - redis-data:/data
    healthcheck:
      test:
      - CMD-SHELL
      - redis-cli -a "$$REDIS_PASSWORD" ping | grep -q PONG
      interval: 10s
      timeout: 5s
      retries: 10
    pull_policy: never
  news-extractor:
    build:
      context: .
      dockerfile: Dockerfile.news-extractor
      args:
        WITH_BROWSER: 'true'
    restart: unless-stopped
    environment:
      NEWS_EXTRACTOR_TOKEN: ${NEWS_EXTRACTOR_TOKEN:?set NEWS_EXTRACTOR_TOKEN}
      NEWS_SCRAPLING_DYNAMIC_ENABLED: 'true'
      NEWS_EXTRACTOR_CONCURRENCY: '4'
      NEWS_EXTRACTOR_DOMAIN_INTERVAL_MS: '1500'
      NEWS_EXTRACTOR_MAX_BYTES: '3000000'
    expose:
    - '8010'
    read_only: true
    tmpfs:
    - /tmp:size=256m
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    pids_limit: 256
    mem_limit: 1536m
    cpus: 1.0
    shm_size: 256m
    stop_grace_period: 35s
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request;urllib.request.urlopen('http://127.0.0.1:8010/health',timeout=4)
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
volumes:
  postgres-data:
    external: true
    name: hqak346ube6ddkgkqmdpozsm_postgres-data
  redis-data:
    external: true
    name: hqak346ube6ddkgkqmdpozsm_redis-data
